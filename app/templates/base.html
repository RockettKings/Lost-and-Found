<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Lost and Found{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='posts.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="container nav">
      <a class="brand" href="{{ url_for('index') }}">Lost and Found</a>
      <div class="nav-links">
        {% if current_user.is_authenticated %}
          <a class="button" href="{{ url_for('pages.create_post') }}">New post</a>
          <span>Account</span>
          <form method="post" action="{{ url_for('auth.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="button secondary" type="submit">Log out</button>
          </form>
        {% else %}
          <a href="{{ url_for('auth.login') }}">Log in</a>
          <a href="{{ url_for('auth.register') }}">Sign up</a>
        {% endif %}
      </div>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash {{ category }}" role="alert">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
